spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${NOTIF_DB_HOST:localhost}:${NOTIF_DB_PORT:5433}/${NOTIF_DB_NAME:notif_db}
    username: ${NOTIF_DB_USER:notif_user}
    password: ${NOTIF_DB_PASSWORD:change-me}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ortakpay}
    password: ${RABBITMQ_PASSWORD:change-me}

server:
  port: 8081

# Health probes drive the container healthcheck in docker-compose; only
# "health" is exposed since this service has no auth-less admin surface.
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
