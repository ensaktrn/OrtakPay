spring:
  application:
    name: core-service

  datasource:
    url: jdbc:postgresql://${CORE_DB_HOST:localhost}:${CORE_DB_PORT:5434}/${CORE_DB_NAME:core_db}
    username: ${CORE_DB_USER:core_user}
    password: ${CORE_DB_PASSWORD:change-me}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ortakpay}
    password: ${RABBITMQ_PASSWORD:change-me}

  # Serializes Page<T> as Spring Data's stable PagedModel DTO instead of the raw
  # PageImpl, whose JSON shape Spring explicitly does not guarantee across versions.
  data:
    web:
      pageable:
        serialization-mode: via-dto

server:
  port: 8080

# Health probes drive the container healthcheck in docker-compose; only
# "health" is exposed since this service has no auth-less admin surface.
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-please-override-in-real-env-1234567890}
    expiration-minutes: 60
