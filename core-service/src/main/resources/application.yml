spring:
  application:
    name: core-service

  datasource:
    url: jdbc:postgresql://localhost:${CORE_DB_PORT:5434}/${CORE_DB_NAME:core_db}
    username: ${CORE_DB_USER:core_user}
    password: ${CORE_DB_PASSWORD:change-me}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ortakpay}
    password: ${RABBITMQ_PASSWORD:change-me}

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
